name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate static site
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Restored after npm ci, which wipes node_modules (and node_modules/.cache with it).
      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.cache/nuxt
            node_modules/.cache/jiti
            .data
          # Unique key per run so each build saves a fresh entry; restore-keys fall back
          # to the newest match, since cache entries are immutable once written.
          key: nuxt-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nuxt-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nuxt-${{ runner.os }}-

      - name: Generate static site
        run: npm run generate
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
